<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply or Not</title>
<style>
:root{--navy:#14324F;--navy2:#1D4268;--teal:#0F766E;--amber:#D97706;--ink:#1A2430;--ink2:#4A5563;--mute:#6B7785;--line:#E2E6EB;--bg:#F4F6F8;--card:#fff;--green:#067647;--greenSoft:#E7F6EE;--red:#B42318;--redSoft:#FDECEA;--amberSoft:#FDF3E7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:22px 16px}
.top .in{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h1{margin:0;font:700 28px/1.2 Georgia,"Times New Roman",serif}
.top p{margin:4px 0 0;color:#C9D6E2}
.ver{background:var(--amber);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:18px;margin-bottom:12px}
.step b{background:var(--navy);color:#fff;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;padding:10px 12px;border:1px solid #CBD2D9;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:160px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#E8ECF0;color:var(--navy);margin-top:14px}
.btn.primary{background:var(--navy);color:#fff}
.btn.small{padding:6px 10px;font-size:13px;margin-top:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{color:var(--mute);font-size:13px}
.banner{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.banner.err{background:var(--redSoft);color:#7A1D14}
.banner.info{background:#E6F4F2;color:#0B4F4A}
.banner.warn{background:var(--amberSoft);color:#7A4A06}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.t-must{background:#E3EAF2;color:var(--navy)} .t-nice{background:#EEF0F2;color:var(--ink2)}
.t-yes{background:var(--greenSoft);color:var(--green)} .t-partial{background:var(--amberSoft);color:#9A5A04} .t-no{background:var(--redSoft);color:var(--red)}
.ev{font-style:italic;color:var(--ink2)}
.nf{color:var(--red);font-weight:600;font-size:13px}
.scorebox{display:flex;align-items:center;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.verdict{font:700 22px Georgia,serif}
.v-apply{color:var(--green)} .v-partial{color:var(--amber)} .v-skip{color:var(--red)}
footer{max-width:960px;margin:0 auto;padding:8px 16px 32px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="in"><div><h1>Apply or Not</h1><p>Know your fit. Fix your CV. Honestly.</p></div><span class="ver" id="ver">v0.3</span></div></header>
<main>
  <section class="card">
    <div class="grid2">
      <div><label for="key" style="margin-top:0">Your Gemini API key</label><input type="password" id="key" placeholder="Paste your key from aistudio.google.com/apikey" autocomplete="off"><div class="hint">Saved in this browser only. Never in the file.</div></div>
      <div><label for="model" style="margin-top:0">Model</label><select id="model"><option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (fast, default)</option><option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option><option value="gemini-3.8-flash">gemini-3.8-flash (smarter, slower)</option></select><div class="hint">Hit a limit? Switch the model.</div></div>
    </div>
  </section>
  <section class="card">
    <div class="step"><b>1</b> Your CV and one job</div>
    <div class="grid2">
      <div><label for="cv">Your CV text</label><textarea id="cv" placeholder="Paste your CV text here"></textarea></div>
      <div><label for="jd">The job post</label><textarea id="jd" placeholder="Paste the full job post here"></textarea></div>
    </div>
    <button class="btn primary" id="matchBtn">Check my fit</button>
    <div id="msg1"></div>
  </section>
  <section class="card hidden" id="res1">
    <div class="scorebox"><div id="ring"></div><div><div class="verdict" id="verdict"></div><div class="hint" id="roleLine"></div></div></div>
    <div class="tablewrap"><table><thead><tr><th>Requirement</th><th>Weight</th><th>Match</th><th>Proof from your CV</th></tr></thead><tbody id="reqRows"></tbody></table></div>
  </section>
</main>
<footer>AI does the fuzzy jobs. Code does the exact jobs. You decide.</footer>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = (sel, on = true) => $(sel).classList.toggle('hidden', !on);
const msg = (sel, text, kind = 'err') => { $(sel).innerHTML = text ? `<div class="banner ${kind}">${text}</div>` : ''; };
const norm = s => String(s || '').toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const state = {};
function busy(sel, on, label){
  const b = $(sel);
  if (on){ b.dataset.label = b.innerHTML; b.innerHTML = `<span class="spin"></span>${label}`; b.disabled = true; }
  else { b.innerHTML = b.dataset.label || b.innerHTML; b.disabled = false; }
}

/* ---------- settings ---------- */
const store = { get(k, d = ''){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
$('#key').value = store.get('apn_key');
$('#model').value = store.get('apn_model', 'gemini-3.1-flash-lite') || 'gemini-3.1-flash-lite';
if (!$('#model').value) $('#model').value = 'gemini-3.1-flash-lite';
$('#key').addEventListener('input', () => store.set('apn_key', $('#key').value.trim()));
$('#model').addEventListener('change', () => store.set('apn_model', $('#model').value));

/* ---------- Gemini (AI does the fuzzy jobs) ---------- */
async function askGemini(system, user){
  const key = $('#key').value.trim().replace(/\s+/g, '');
  const model = $('#model').value;
  if (!key) throw new Error('Paste your Gemini API key at the top first.');
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
      body: JSON.stringify({systemInstruction: {parts: [{text: system}]}, contents: [{role: 'user', parts: [{text: user}]}], generationConfig: {responseMimeType: 'application/json'}})
    });
  } catch(e){ throw new Error('Could not reach Gemini. Try your phone hotspot.'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok){
    const m = body?.error?.message || res.statusText || '';
    if (res.status === 400 && /key/i.test(m)) throw new Error('This API key is not valid. Copy it again.');
    if (res.status === 429) throw new Error('Gemini limit reached. Wait 60 seconds or switch the model.');
    if (res.status === 404) throw new Error('Model not found. Switch the model.');
    if (res.status === 503) throw new Error('Gemini is busy. Click again.');
    throw new Error(`Gemini error ${res.status}: ${esc(m)}`);
  }
  const text = (body?.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  const t = text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch(e){
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(_){} }
    throw new Error('The AI returned something we could not read. Click again.');
  }
}

const MATCH_SYSTEM = `You compare a CV with a job post.
List every requirement in the job post. Put the must-haves first, then the nice-to-haves. Never cap, sample, skip or merge requirements.
For each requirement give:
- requirement: short, in plain words
- importance: "must" if the post says it is required, otherwise "nice"
- match: "yes", "partial" or "no", judged only from what the CV says
- evidence: an exact phrase or sentence copied character for character from the CV that proves the match, or "" if there is none
Also give the role and the company from the job post.
Return JSON only: {"role":"","company":"","requirements":[{"requirement":"","importance":"must|nice","match":"yes|partial|no","evidence":""}]}`;

/* ---------- Code does the exact jobs ---------- */
const MUST_POINTS = 2, NICE_POINTS = 1, APPLY_AT = 75, SKIP_BELOW = 50;
const VAL = {yes: 1, partial: 0.5, no: 0};
function verify(reqs, cvText){
  const hay = norm(cvText);
  return reqs.map(r => {
    const x = {...r, match: ['yes', 'partial', 'no'].includes(r.match) ? r.match : 'no', importance: r.importance === 'must' ? 'must' : 'nice'};
    const proven = x.evidence && hay.includes(norm(x.evidence));
    x.notFound = false;
    if (!proven && x.match !== 'no'){ x.match = x.match === 'yes' ? 'partial' : 'no'; x.notFound = !!x.evidence; }
    if (!proven) x.evidence = x.notFound ? x.evidence : '';
    return x;
  });
}
function score(reqs){
  let pts = 0, max = 0;
  reqs.forEach(r => { const w = r.importance === 'must' ? MUST_POINTS : NICE_POINTS; max += w; pts += w * VAL[r.match]; });
  return max ? Math.round(pts / max * 100) : 0;
}
function verdict(s){ return s >= APPLY_AT ? {k: 'apply', t: 'Apply'} : s < SKIP_BELOW ? {k: 'skip', t: 'Skip'} : {k: 'partial', t: 'Partial fit'}; }
function ring(s, color){
  const r = 44, c = 2 * Math.PI * r, off = c * (1 - s / 100);
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#E2E6EB" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-size="26" font-weight="700" font-family="Georgia,serif" fill="#14324F">${s}</text></svg>`;
}
const COLOR = {apply: '#067647', partial: '#D97706', skip: '#B42318'};

async function runMatch(){
  msg('#msg1', '');
  const cv = $('#cv').value.trim(), jd = $('#jd').value.trim();
  if (cv.length < 100) return msg('#msg1', 'Your CV text looks too short. Paste the full CV.');
  if (jd.length < 100) return msg('#msg1', 'Paste the full job post, not just the title.');
  busy('#matchBtn', true, 'Reading and matching');
  try {
    const out = await askGemini(MATCH_SYSTEM, `CV:\n"""${cv}"""\n\nJOB POST:\n"""${jd}"""`);
    if (!Array.isArray(out.requirements) || !out.requirements.length) throw new Error('The AI found no requirements. Check the job post and try again.');
    let reqs = out.requirements.map((r, i) => ({...r, id: 'r' + (i + 1)}));
    reqs = verify(reqs, cv);
    state.match = {role: out.role || '', company: out.company || '', reqs, cv, jd};
    state.before = score(reqs);
    renderMatch();
  } catch(e){ msg('#msg1', e.message); }
  busy('#matchBtn', false);
}
$('#matchBtn').addEventListener('click', runMatch);

function renderMatch(){
  const m = state.match;
  $('#roleLine').textContent = [m.role, m.company].filter(Boolean).join(' at ');
  const v = verdict(state.before);
  $('#ring').innerHTML = ring(state.before, COLOR[v.k]);
  $('#verdict').className = 'verdict v-' + v.k; $('#verdict').textContent = v.t;
  $('#reqRows').innerHTML = m.reqs.map(r => `<tr><td>${esc(r.requirement)}</td><td><span class="tag t-${r.importance === 'must' ? 'must' : 'nice'}">${r.importance === 'must' ? 'Must' : 'Nice'}</span></td><td><span class="tag t-${esc(r.match)}">${esc(r.match)}</span></td><td>${r.notFound ? '<span class="nf">Not found in your CV</span>' : r.evidence ? `<span class="ev">"${esc(r.evidence)}"</span>` : '<span class="hint">None</span>'}</td></tr>`).join('');
  show('#res1');
}
</script>
</body>
</html>
