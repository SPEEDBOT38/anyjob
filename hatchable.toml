# Hatchable project manifest. This file marks the folder as a
# Hatchable project and declares the services it uses.
# Reference: https://hatchable.com/docs/developers/config
name = "AnyJob"
description = "Know your fit, fix your CV honestly. Paste your CV and a job post: AnyJob scores the fit, rewrites the CV toward the job without inventing anything, and lets you approve every change. Signal design with Tex the mascot."

[[secret]]
name        = "KILO_API_KEY"
required    = false
description = "Optional. Lets AnyJob use Kilo to rank existing CV lines by relevance to a job posting."

[[secret]]
name        = "APIFY_API_TOKEN"
required    = false
description = "Optional. Lets AnyJob import jobs from an existing Apify dataset ID."

[[config]]
name    = "kilo_model"
type    = "text"
label   = "Kilo model"
default = "kilo-auto"
