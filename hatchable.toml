# Hatchable project manifest. This file marks the folder as a
# Hatchable project and declares the services it uses.
# Reference: https://hatchable.com/docs/developers/config
name = "AnyJob"
description = "Know your fit, fix your CV honestly. Paste your CV and a job post: AnyJob scores the fit, rewrites the CV toward the job without inventing anything, and lets you approve every change. Signal design with Tex the mascot."

[[secret]]
name        = "KILO_API_KEY"
required    = false
description = "Kilo AI gateway key (app.kilo.ai). Powers fit analysis, tailoring suggestions, cover letters and CV clean-up."

[[secret]]
name        = "APIFY_API_TOKEN"
required    = false
description = "Your Apify API token (apify.com > Settings > API & Integrations). Turns on live LinkedIn job search for any city and lets AnyJob import jobs from an Apify dataset."

[[config]]
name    = "kilo_model"
type    = "text"
label   = "Kilo model (free models only; paid model names are ignored)"
default = "kilo-auto/free"
